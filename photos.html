    <script>
        const photoCards = [...document.querySelectorAll('.photo-card')];
        const photoScrim = document.querySelector('.photo-scrim');
        let focusedPhoto = null;
        let focusedPhotoTrigger = null;

        function sizeFocusedPhoto(card) {
            const image = card.querySelector('img');
            if (!image.complete || !image.naturalWidth) {
                image.addEventListener('load', () => {
                    if (focusedPhoto === card) {
                        sizeFocusedPhoto(card);
                    }
                }, { once: true });
            }

            const aspectRatio = image.naturalWidth && image.naturalHeight ? image.naturalWidth / image.naturalHeight : 4 / 3;
            const maxWidth = window.innerWidth * 0.9;
            const maxHeight = window.innerHeight * 0.84;
            let width = maxWidth;
            let height = width / aspectRatio;

            if (height > maxHeight) {
                height = maxHeight;
                width = height * aspectRatio;
            }

            card.style.setProperty('--focused-width', `${Math.round(width)}px`);
            card.style.setProperty('--focused-height', `${Math.round(height)}px`);
        }

        function clearFocusedPhoto() {
            if (!focusedPhoto) {
                return;
            }

            focusedPhoto.classList.remove('is-focused', 'is-flipped');
            focusedPhoto.style.removeProperty('--focused-width');
            focusedPhoto.style.removeProperty('--focused-height');
            focusedPhoto.remove();

            focusedPhoto = null;
            document.body.classList.remove('photo-modal-open');

            if (focusedPhotoTrigger) {
                focusedPhotoTrigger.focus();
                focusedPhotoTrigger = null;
            }
        }

        function focusPhoto(card) {
            if (focusedPhoto) {
                clearFocusedPhoto();
            }

            const clone = card.cloneNode(true);
            const cloneButton = clone.querySelector('.photo-flip');
            const cloneCloseButton = clone.querySelector('.photo-close');

            clone.classList.remove('is-flipped');
            clone.classList.add('is-focused');
            cloneButton.setAttribute('aria-label', 'Flip focused photo for caption');
            cloneButton.addEventListener('click', () => {
                clone.classList.toggle('is-flipped');
            });
            cloneCloseButton.addEventListener('click', (event) => {
                event.stopPropagation();
                clearFocusedPhoto();
            });

            focusedPhoto = clone;
            focusedPhotoTrigger = card.querySelector('.photo-flip');
            document.body.appendChild(clone);
            sizeFocusedPhoto(clone);
            document.body.classList.add('photo-modal-open');
            cloneButton.focus();
        }

        photoCards.forEach((card) => {
            const button = card.querySelector('.photo-flip');
            const closeButton = card.querySelector('.photo-close');

            card.dataset.defaultLabel = button.getAttribute('aria-label');

            button.addEventListener('click', () => {
                focusPhoto(card);
            });

            closeButton.addEventListener('click', (event) => {
                event.stopPropagation();
                clearFocusedPhoto();
                button.focus();
            });
        });

        photoScrim.addEventListener('click', clearFocusedPhoto);

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') {
                clearFocusedPhoto();
            }
        });

        window.addEventListener('resize', () => {
            if (focusedPhoto) {
                sizeFocusedPhoto(focusedPhoto);
            }
        });
    </script>
