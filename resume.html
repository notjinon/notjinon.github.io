<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - jino's website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="header-content">
            <h1 class="lexend-deca-bold">jino nicolas</h1>
            <button class="hamburger" onclick="toggleNavMenu()">&#9776;</button>
            <nav>
                <ul>
                    <li><a href="index.html">home</a></li>
                    <li><a href="projects.html">projects</a></li>
                    <li><a href="contact.html">contact</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="main">
            <section id="resume">
                <h2>resume</h2>
                <div style="padding-top: 20px;"></div>
                <embed src="assets/resume.pdf" width="100%" height="800px" type="application/pdf">
            </section>
        </div>
    </main>
    <script>
        function toggleMobileMode() {
            if (window.innerWidth <= 768) {
                document.body.classList.add('mobile-mode');
            } else {
                document.body.classList.remove('mobile-mode');
            }
        }

        function toggleNavMenu() {
            const nav = document.querySelector('nav ul');
            nav.classList.toggle('show');
        }

        // Initial check
        toggleMobileMode();

        // Add event listener for window resize
        window.addEventListener('resize', toggleMobileMode);
    </script>
</body>
</html>
