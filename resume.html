    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;700&family=Roboto+Mono:wght@400;700&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">

</head>
<body>
    <header>
        <div class="header-content">
            <h1 class="lexend-deca-bold">jino nicolas</h1>
            <button class="hamburger" onclick="toggleNavMenu()">&#9776;</button>
            <div class="header-right">
                <nav>
                    <ul>
                        <li><a href="index.html">home</a></li>
                        <li><a href="projects.html">work</a></li>

    <main>

            <section id="resume">

    <footer>

    </footer>  
    <script>
        function toggleMobileMode() {
            if (window.innerWidth <= 768) {
                document.body.classList.add('mobile-mode');
            } else {
                document.body.classList.remove('mobile-mode');
            }
        }

        function toggleNavMenu() {
            const nav = document.querySelector('nav ul');
            nav.classList.toggle('show');
        }

        // Initial check
        toggleMobileMode();

        // Add event listener for window resize
        window.addEventListener('resize', toggleMobileMode);
    </script>
</body>
</html>
